<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Y2Kbot: a frosted chrome orb-bot with a millennium orbit ring (original artwork) -->
  <defs>
    <radialGradient id="orb" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfe5fb"/>
      <stop offset="0.75" stop-color="#6ea8e6"/>
      <stop offset="1" stop-color="#2a63b8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9aa8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8d9aa8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16305e"/>
      <stop offset="1" stop-color="#0b1a38"/>
    </linearGradient>
  </defs>
  <!-- back half of the orbit ring -->
  <path d="M5 37 A27 9 -14 0 1 59 24" fill="none" stroke="#7d8b9a" stroke-width="3.2" stroke-linecap="round"/>
  <!-- antenna -->
  <line x1="32" y1="12" x2="32" y2="5.5" stroke="#5d6b7a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 0.8 L33.3 4 L36.6 4.2 L34 6.2 L34.9 9.4 L32 7.6 L29.1 9.4 L30 6.2 L27.4 4.2 L30.7 4 Z" fill="#ffd34d" stroke="#b8860b" stroke-width="0.6"/>
  <!-- the orb head -->
  <circle cx="32" cy="33" r="21" fill="url(#orb)" stroke="#1d4f9a" stroke-width="1.6"/>
  <!-- visor + eyes -->
  <rect x="18" y="26" width="28" height="13" rx="6.5" fill="url(#visor)"/>
  <circle cx="25.5" cy="32.5" r="3" fill="#6ff3ff"/>
  <circle cx="38.5" cy="32.5" r="3" fill="#6ff3ff"/>
  <circle cx="24.6" cy="31.5" r="0.9" fill="#ffffff"/>
  <circle cx="37.6" cy="31.5" r="0.9" fill="#ffffff"/>
  <!-- smile -->
  <path d="M27 44 Q32 47.5 37 44" fill="none" stroke="#1d4f9a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- shine -->
  <ellipse cx="24" cy="20" rx="6" ry="3" fill="#ffffff" opacity="0.75" transform="rotate(-25 24 20)"/>
  <!-- front half of the orbit ring -->
  <path d="M59 24 A27 9 -14 0 1 5 37" fill="none" stroke="url(#ring)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M55 46 L56 49 L59 50 L56 51 L55 54 L54 51 L51 50 L54 49 Z" fill="#ffffff" stroke="#85b7eb" stroke-width="0.6"/>
</svg>
