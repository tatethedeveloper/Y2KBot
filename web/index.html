<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Only the app's own files run here. Inline styles are allowed (the UI sets style="" a lot); scripts are not. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Y2Kbot</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.svg" />
</head>
<body>
  <div id="app"></div>

  <!-- ===== templates ===== -->
  <template id="tpl-window">
    <div class="window">
      <div class="titlebar">
        <img class="title-icon" src="logo.svg" alt="" />
        <span class="title"></span>
        <div class="title-buttons">
          <button class="tb tb-min" title="Minimize"><span>_</span></button>
          <button class="tb tb-close" title="Close"><span>✕</span></button>
        </div>
      </div>
      <div class="window-body"></div>
    </div>
  </template>

  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
